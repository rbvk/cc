name: Validate private Command Center
on:
  push:
    paths:
      - 'apps-script/**'
      - '.github/workflows/validate-command-center.yml'
  pull_request:
    paths:
      - 'apps-script/**'
      - '.github/workflows/validate-command-center.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run V9 security, source-setup and operational regression tests
        run: |
          node apps-script/tests/command-center-v9.mjs
